<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Математическая печать</title>
  <desc id="desc">Четыре связанных математических квадрата с двадцатью пустыми местами</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#241307" flood-opacity=".55"/></filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4dfac"/><stop offset=".5" stop-color="#d9b878"/><stop offset="1" stop-color="#f0d79b"/></linearGradient>
    <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="6" cy="10" r="1.2" fill="#8b622e" opacity=".16"/><circle cx="31" cy="35" r="1" fill="#fff3cf" opacity=".3"/></pattern>
    <style>
      .line{fill:none;stroke:#6c421d;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.fine{fill:none;stroke:#9e6d33;stroke-width:2}.slot{fill:#f8e9bd;stroke:#7a4a21;stroke-width:4;rx:9}.math{fill:#3f2512;font:700 25px Georgia,serif;text-anchor:middle;dominant-baseline:middle}.fixed{fill:#3f2512;font:700 28px Georgia,serif;text-anchor:middle;dominant-baseline:middle}.seal{fill:#4d7b62;stroke:#8c5b27;stroke-width:8}
    </style>
  </defs>
  <path d="M58 30 Q32 55 45 106 L30 594 Q42 645 96 650 L1100 650 Q1158 641 1164 594 L1152 92 Q1160 43 1104 31Z" fill="url(#paper)" stroke="#5d3619" stroke-width="12" filter="url(#shadow)"/>
  <path d="M58 30 Q32 55 45 106 L30 594 Q42 645 96 650 L1100 650 Q1158 641 1164 594 L1152 92 Q1160 43 1104 31Z" fill="url(#grain)"/>
  <path class="fine" d="M76 62H1124V618H76Z"/>

  <!-- four linked squares -->
  <path class="line" d="M165 120H415V300H165ZM785 120H1035V300H785ZM165 380H415V560H165ZM785 380H1035V560H785Z"/>
  <path class="line" d="M415 210H785M910 300V380M415 470H785M290 300V380"/>
  <circle class="seal" cx="600" cy="340" r="62"/><path class="fine" d="M600 292l14 29 32 5-23 23 6 33-29-16-29 16 6-33-23-23 32-5z"/>

  <!-- reserved answer places -->
  <g aria-hidden="true">
    <rect class="slot" x="132" y="87" width="66" height="66"/><rect class="slot" x="382" y="87" width="66" height="66"/><rect class="slot" x="382" y="267" width="66" height="66"/><rect class="slot" x="132" y="267" width="66" height="66"/>
    <rect class="slot" x="752" y="87" width="66" height="66"/><rect class="slot" x="1002" y="87" width="66" height="66"/><rect class="slot" x="1002" y="267" width="66" height="66"/><rect class="slot" x="752" y="267" width="66" height="66"/>
    <rect class="slot" x="132" y="347" width="66" height="66"/><rect class="slot" x="382" y="347" width="66" height="66"/><rect class="slot" x="382" y="527" width="66" height="66"/><rect class="slot" x="132" y="527" width="66" height="66"/>
    <rect class="slot" x="752" y="347" width="66" height="66"/><rect class="slot" x="1002" y="347" width="66" height="66"/><rect class="slot" x="1002" y="527" width="66" height="66"/><rect class="slot" x="752" y="527" width="66" height="66"/>
    <rect class="slot" x="567" y="177" width="66" height="66"/><rect class="slot" x="877" y="307" width="66" height="66"/><rect class="slot" x="567" y="437" width="66" height="66"/><rect class="slot" x="257" y="307" width="66" height="66"/>
  </g>

  <!-- exact fixed mathematics -->
  <text class="math" x="290" y="105">× 3 =</text><text class="math" x="430" y="210" transform="rotate(90 430 210)">÷ 2 =</text><text class="math" x="290" y="315">− 5 =</text><text class="math" x="150" y="210" transform="rotate(-90 150 210)">+ 14 =</text>
  <text class="math" x="910" y="105">÷ 2 =</text><text class="math" x="1050" y="210" transform="rotate(90 1050 210)">× 3 =</text><text class="math" x="910" y="315">+ 62 =</text><text class="math" x="770" y="210" transform="rotate(-90 770 210)">− 34 =</text>
  <text class="math" x="290" y="365">+ 48 =</text><text class="math" x="430" y="470" transform="rotate(90 430 470)">÷ 2 =</text><text class="math" x="290" y="575">− 6 =</text><text class="math" x="150" y="470" transform="rotate(-90 150 470)">+ 18 =</text>
  <text class="math" x="910" y="365">× 3 =</text><text class="math" x="1050" y="470" transform="rotate(90 1050 470)">÷ 2 =</text><text class="math" x="910" y="575">− 1 =</text><text class="math" x="770" y="470" transform="rotate(-90 770 470)">+ 14 =</text>
  <text class="fixed" x="455" y="210">2 ×</text><text class="fixed" x="718" y="210">= 34</text>
  <text class="fixed" x="910" y="278">62 −</text><text class="fixed" x="910" y="402">= 3</text>
  <text class="fixed" x="455" y="470">2 +</text><text class="fixed" x="718" y="470">= 14</text>
  <text class="fixed" x="290" y="278">5 +</text><text class="fixed" x="290" y="402">= 48</text>
</svg>
